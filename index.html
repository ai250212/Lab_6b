<!DOCTYPE html>
<html>
<head>
    <title>JSON Book Collection</title>
</head>
<body>

    <h1>Book Collection</h1>

    <script>
        fetch("books.json")
            .then(response => response.json())
            .then(data => {

                console.log("First Book Title:");
                console.log(data.books[0].title);

                console.log("Second Book Author:");
                console.log(data.books[1].author);

                console.log("Genres of All Books:");

                data.books.forEach(book => {
                    console.log(book.genres);
                });

            })
            .catch(error => console.error("Error:", error));
    </script>

</body>
</html>
